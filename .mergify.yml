pull_request_rules:
  - name: Ping PR author when conflicting
    description: Warn the pull request author when their PR is conflicting. Tag @jules if they're an author.
    conditions:
      - conflict
      - -closed
    actions:
      comment:
        message: >
          👋 @{{author}} your PR is conflicting and needs to be updated to be
          merged.
          {# NOTE: GitHub username is google-labs-jules[bot], not "jules" #}
          {% if author == "google-labs-jules[bot]" or "google-labs-jules[bot]" in assignees %}
          
          **Note for @jules:** This PR requires conflict resolution. Consider rebasing on latest main or using interactive merge.
          {% endif %}

  - name: Alert @jules on conflicts for their PRs
    description: Notify @jules specifically when their PRs have merge conflicts
    conditions:
      - conflict
      - -closed
      # NOTE: GitHub username is google-labs-jules[bot], not "jules"
      - author=google-labs-jules[bot]
    actions:
      comment:
        message: >
          ⚠️ **@jules** - This PR has merge conflicts that need resolution:
          
          **Quick Fix Options:**
          1. **Rebase on main:** `git fetch origin && git rebase origin/main`
          2. **Merge main:** `git fetch origin && git merge origin/main`
          3. **Use GitHub UI:** Click "Resolve conflicts" button on this PR
          
          After resolving: `git push --force-with-lease` (if rebased) or `git push` (if merged)

  # Rule 1: Dependabot PRs — auto-merge when real CI passes + SonarQube clean
  - name: Automatically merge Dependabot PRs when CI and quality gates pass
    conditions:
      - author=dependabot[bot]
      - check-success=test
      - check-success=sonarcloud
      - -label=do-not-merge
    actions:
      merge:
        method: merge

  # Rule 2: Agent PRs (Jules/Sentinel/Bolt) — require human label
  # NOTE: This rule is restricted to agent-authored PRs via `author` conditions.
  - name: Auto-merge agent PRs only when explicitly approved
    conditions:
      # Auto-merge must be explicitly requested
      - label=auto-merge-approved

      # Restrict to agent authors so human PRs don't bypass normal approval rules
      - or:
          - author=jules-bot
          - author=sentinel-bot
          - author=bolt-bot
          - author=google-labs-jules[bot]

      # CI must be green
      - check-success=test
      - check-success=sonarcloud

      # Block if certain labels are present
      - -label=do-not-merge
      - -label=review-finding-open
    actions:
      merge:
        method: squash

  # Rule 3: Block PRs with unresolved review findings
  - name: Block PRs with open review findings
    conditions:
      - label=review-finding-open
    actions:
      post_check:
        title: "Blocked: unresolved Critical/High review findings"
        summary: |
          This PR has unresolved findings from Qodo or SonarQube.
          Remove the 'review-finding-open' label after addressing them.

  - name: Label conflicting pull requests
    description: Add a label to a pull request with conflict to spot it easily
    conditions:
      - conflict
      - -closed
    actions:
      label:
        add:
          - conflict

  - name: Remove conflict label when resolved
    description: Remove the conflict label when the conflict is resolved
    conditions:
      - -conflict
    actions:
      label:
        remove:
          - conflict
