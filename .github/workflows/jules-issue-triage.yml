name: Jules Issue Triage

# Automatically labels new and reopened issues based on AI analysis.
# Replaces the deprecated Gemini triage workflows (gemini-triage.yml,
# gemini-scheduled-triage.yml) which relied on the Google Gemini CLI.
#
# Trigger: issues: [opened, reopened, edited] — immediate triage on new issue activity

on:
  issues:
    types: [opened, reopened, edited]

concurrency:
  group: jules-triage-${{ github.event.issue.number || github.event.pull_request.number || 'schedule' }}
  cancel-in-progress: false

jobs:
  triage:
    # Only run on issues, not PRs (PRs have pull_request in the event payload)
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch issue details and available labels
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            // Skip if already has labels (for scheduled runs) or is a PR
            const existingLabels = (issue.labels || []).map(l => l.name);
            if (existingLabels.length > 0 && context.eventName === 'schedule') {
              core.setOutput('skip', 'true');
              core.setOutput('reason', 'already-labeled');
              return;
            }

            // Skip if this is actually a PR
            if (issue.pull_request) {
              core.setOutput('skip', 'true');
              core.setOutput('reason', 'is-pr');
              return;
            }

            // Fetch available labels for the repo
            const { data: labels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            if (!labels || labels.length === 0) {
              core.setOutput('skip', 'true');
              core.setOutput('reason', 'no-labels');
              return;
            }

            const labelNames = labels.map(l => l.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.setOutput('issue_title', issue.title);
            core.setOutput('issue_body', issue.body || '');
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);

      - name: Skip (already labeled or PR or no labels)
        if: steps.prepare.outputs.skip == 'true'
        shell: bash
        run: |
          echo "Skipped — reason: ${{ steps.prepare.outputs.reason }}"

      - name: Prepare Jules triage prompt
        if: steps.prepare.outputs.skip != 'true'
        id: prompt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNumber = context.issue.number;

            const prompt = [
              `## Role`,
              ``,
              `You are a GitHub issue triage assistant. Your task is to analyze the`,
              `given issue and assign the most appropriate existing labels from the`,
              `available list. You are NOT to create new labels — only choose from`,
              `the provided list.`,
              ``,
              `## Available Labels`,
              `\${AVAILABLE_LABELS}`,
              ``,
              `## Issue`,
              ``,
              `### Title`,
              `\${ISSUE_TITLE}`,
              ``,
              `### Body`,
              `\${ISSUE_BODY}`,
              ``,
              `## Instructions`,
              ``,
              `1. Analyze the issue title and body.`,
              `2. Classify the issue by type (bug, enhancement, question, etc.) and`,
              `   priority (low, medium, high, critical).`,
              `3. Consider the affected area (frontend, backend, database, docs, CI/CD`,
              `   config, etc.).`,
              `4. Select ALL appropriate labels from the available list.`,
              `5. Output your selection as a JSON object at the end of your response:`,
              ``,
              `\`\`\`json`,
              `{"labels": ["LABEL1", "LABEL2", "LABEL3"]}`,
              `\`\`\``,
              ``,
              `6. If no labels are appropriate, output: \`{"labels": []}\``,
              ``,
              `---`,
              `Repository: ${context.repo.owner}/${context.repo.repo}`,
              `Issue number: ${issueNumber}`,
            ].join('\\n');

            const payload = {
              prompt,
              sourceContext: {
                source: `sources/github/${context.repo.owner}/${context.repo.repo}`,
              },
            };

            fs.writeFileSync('/tmp/jules-triage-payload.json', JSON.stringify(payload));
            core.setOutput('issue_number', issueNumber);

      - name: Create Jules session
        if: steps.prepare.outputs.skip != 'true'
        id: create
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          AVAILABLE_LABELS: ${{ steps.prepare.outputs.available_labels }}
          ISSUE_TITLE: ${{ steps.prepare.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.prepare.outputs.issue_body }}
        run: |
          # Inject env vars into the prompt file
          sed -i "s|\\\${AVAILABLE_LABELS}|${AVAILABLE_LABELS}|g" /tmp/jules-triage-payload.json
          sed -i "s|\\\${ISSUE_TITLE}|${ISSUE_TITLE}|g" /tmp/jules-triage-payload.json
          sed -i "s|\\\${ISSUE_BODY}|${ISSUE_BODY}|g" /tmp/jules-triage-payload.json

          RESPONSE=$(curl -sS --fail-with-body -X POST "https://jules.googleapis.com/v1alpha/sessions" \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
            -d @/tmp/jules-triage-payload.json)

          SESSION_NAME=$(echo "$RESPONSE" | jq -r '.name // empty')
          SESSION_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$SESSION_NAME" ] && [ -z "$SESSION_ID" ]; then
            echo "Error: $RESPONSE"
            exit 1
          fi

          echo "session_name=$SESSION_NAME" >> "$GITHUB_OUTPUT"
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "Session created: $SESSION_NAME"

      - name: Poll for completion
        if: steps.prepare.outputs.skip != 'true'
        id: poll
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_NAME: ${{ steps.create.outputs.session_name }}
          SESSION_ID: ${{ steps.create.outputs.session_id }}
          ISSUE_NUMBER: ${{ steps.prepare.outputs.issue_number }}
        run: |
          SESSION_RESOURCE="${SESSION_NAME:-sessions/${SESSION_ID}}"
          MAX_ATTEMPTS=30

          for i in $(seq 1 $MAX_ATTEMPTS); do
            sleep 10
            RESPONSE=$(curl -sS --fail-with-body --connect-timeout 10 --max-time 60 \
              "https://jules.googleapis.com/v1alpha/${SESSION_RESOURCE}?view=FULL" \
              -H "X-Goog-Api-Key: ${JULES_API_KEY}")
            STATE=$(echo "$RESPONSE" | jq -r '.state // "UNKNOWN"')

            if [ "$STATE" = "COMPLETED" ] || [ "$STATE" = "FAILED" ]; then
              ACTS=$(curl -sS --fail-with-body --connect-timeout 10 --max-time 60 \
                "https://jules.googleapis.com/v1alpha/${SESSION_RESOURCE}/activities?pageSize=100" \
                -H "X-Goog-Api-Key: ${JULES_API_KEY}")
              echo "$ACTS" | jq -r '[(.activities // [])[] | select(.agentMessaged.agentMessage != null)][-1].agentMessaged.agentMessage // "Triage unavailable"' > /tmp/jules-triage-output.txt
              echo "session_state=$STATE" >> "$GITHUB_OUTPUT"
              echo "Session finished ($STATE)"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS — state: $STATE"
          done

          echo "session_state=TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "Triage timed out after $((MAX_ATTEMPTS * 10)) seconds." > /tmp/jules-triage-output.txt

      - name: Parse and apply labels
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          SESSION_STATE: ${{ steps.poll.outputs.session_state }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/jules-triage-output.txt', 'utf8');
            const issueNumber = context.issue.number;

            core.info(`Jules session state: ${process.env.SESSION_STATE}`);
            core.info(`Raw output (last 500 chars): ${output.slice(-500)}`);

            // Extract JSON label selection from the end of the response
            const jsonMatch = output.match(/\{\s*"labels"\s*:\s*\[[^\]]*\]\s*\}\s*$/);
            if (!jsonMatch) {
              core.info('No label JSON found in output — skipping label application');
              return;
            }

            let labels;
            try {
              labels = JSON.parse(jsonMatch[0]).labels;
            } catch (e) {
              core.warning(`Failed to parse labels JSON: ${e.message}`);
              return;
            }

            if (!labels || labels.length === 0) {
              core.info('No labels selected by Jules — skipping');
              return;
            }

            // Fetch available labels to validate
            const { data: availableLabels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const validLabelNames = new Set(availableLabels.map(l => l.name));

            // Filter to only valid labels
            const validLabels = labels.filter(l => validLabelNames.has(l));
            if (validLabels.length < labels.length) {
              core.warning(`Filtered out ${labels.length - validLabels.length} invalid labels`);
            }

            if (validLabels.length === 0) {
              core.info('No valid labels to apply after filtering');
              return;
            }

            // Apply labels
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: validLabels,
              });
              core.info(`Applied labels: ${validLabels.join(', ')}`);
            } catch (e) {
              core.warning(`Failed to apply labels: ${e.message}`);
            }

            // Post a comment with the triage result
            const commentBody = `<!-- jules-triage -->\n\n## 🤖 Jules Issue Triage\n\n**Session state:** ${process.env.SESSION_STATE}\n\n**Labels applied:** ${validLabels.map(l => `\`${l}\``).join(', ')}\n\nThis issue was automatically triaged by Jules. If labels are incorrect, a maintainer can adjust them manually.`;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody,
              });
            } catch (e) {
              core.warning(`Failed to post triage comment: ${e.message}`);
            }
