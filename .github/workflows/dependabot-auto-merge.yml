name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && !github.event.pull_request.draft

    steps:
      - name: Wait for CI checks to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          echo "Waiting for CI checks on PR #$PR"
          MAX_ATTEMPTS=60
          INTERVAL=10

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo "Checking CI status... (attempt $i/$MAX_ATTEMPTS)"

            # Fail closed: if the check list cannot be read, merge nothing.
            if ! CHECKS=$(gh pr checks "$PR" --json bucket); then
              echo "Could not read check status; refusing to auto-merge."
              exit 1
            fi

            TOTAL=$(printf '%s' "$CHECKS" | jq 'length')
            PENDING=$(printf '%s' "$CHECKS" | jq '[.[] | select(.bucket | test("(?i)pending"))] | length')
            FAILED=$(printf '%s' "$CHECKS" | jq '[.[] | select(.bucket | test("(?i)fail|cancel"))] | length')
            echo "checks=$TOTAL pending=$PENDING failed=$FAILED"

            # A PR with no checks at all has not passed anything.
            if [ "$TOTAL" -eq 0 ]; then
              echo "No checks reported for this PR; refusing to auto-merge."
              exit 1
            fi

            if [ "$PENDING" -eq 0 ]; then
              if [ "$FAILED" -eq 0 ]; then
                echo "All $TOTAL checks passed."
                exit 0
              fi
              echo "Some CI checks failed ($FAILED)."
              exit 1
            fi

            sleep $INTERVAL
          done

          echo "Timeout waiting for CI checks"
          exit 1

      - name: Auto-merge Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "CI checks passed. Auto-merging Dependabot PR #$PR"

          MERGEABLE=$(gh pr view "$PR" --json mergeable --jq '.mergeable')
          if [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "PR is not mergeable ($MERGEABLE); refusing to auto-merge."
            exit 1
          fi

          # Approve the PR first
          if ! gh pr review "$PR" --approve --body "✅ CI checks passed! Auto-merging this Dependabot PR."; then
            echo "Failed to approve PR. Exiting."
            exit 1
          fi

          # Enable auto-merge
          if ! gh pr merge --auto --merge "$PR"; then
            echo "Failed to enable auto-merge. Checking if already enabled..."
            # Check if auto-merge is already enabled
            if gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest' | grep -q "null"; then
              echo "Auto-merge failed and is not enabled. Manual intervention required."
              exit 1
            else
              echo "Auto-merge is already enabled."
            fi
          fi

          echo "Auto-merge successfully enabled for PR #$PR"
