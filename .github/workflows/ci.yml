name: CI

on:
  push:
    branches: [main, scientific]
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
      - 'backlog/**'
      - '.github/workflows/*.DISABLED'
  pull_request:
    branches: [main, scientific]
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
      - 'backlog/**'
      - '.github/workflows/*.DISABLED'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci:lint-only]') &&
      !contains(github.event.pull_request.labels.*.name, 'ci:skip-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: |
          uv run pytest tests/ src/ modules/ -v --tb=short \
            --cov=src --cov=modules --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70
      - name: Run Security Scans
        run: uv run bandit -r src/ modules/
      - name: Run linting
        run: |
          uv run ruff check src/ modules/
          uv run ruff format --check src/ modules/
      - name: Type checking
        run: uv run mypy src/ modules/ --show-error-codes --no-strict-optional
